<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Disc art template, 1024 x 1024. Put your art in the "Artwork" layer, then hide the "Guides"
       layer and export the frame at 1x as PNG/JPG (or build a 1024 x 1024 video/GIF to the same guides).
       Measurements match assets/js/discs.js (artResolution 1024, holeSize .14, hubSize .24, edgeBleed .026). -->
  <title>Disc art guide 1024</title>
  <g id="Artwork - place 1024x1024 art here">
    <rect id="Placeholder - delete" width="1024" height="1024" fill="#D9D9D9"/>
  </g>
  <g id="Guides - hide before export">
    <path id="Hidden - corners and edge trim" d="M0 0H1024V1024H0Z M13.3 512.0 a498.7 498.7 0 1 0 997.4 0 a498.7 498.7 0 1 0 -997.4 0Z" fill="#FF2D6F" fill-opacity=".22" fill-rule="evenodd"/>
    <circle id="Disc edge (art visible inside)" cx="512.0" cy="512.0" r="498.7" fill="none" stroke="#FF2D6F" stroke-width="2"/>
    <circle id="Full frame circle" cx="512.0" cy="512.0" r="512.0" fill="none" stroke="#FF2D6F" stroke-width="1" stroke-dasharray="6 6"/>
    <circle id="Hidden - hub" cx="512.0" cy="512.0" r="122.9" fill="#FF2D6F" fill-opacity=".22" stroke="#FF2D6F" stroke-width="2"/>
    <circle id="Hole" cx="512.0" cy="512.0" r="71.7" fill="#FFFFFF" fill-opacity=".85" stroke="#FF2D6F" stroke-width="1"/>
    <g id="Centre lines" stroke="#FF2D6F" stroke-opacity=".5" stroke-width="1">
      <line x1="512.0" y1="0" x2="512.0" y2="1024"/><line x1="0" y1="512.0" x2="1024" y2="512.0"/>
    </g>
    <g id="Text zones" fill="#2F6FED" fill-opacity=".1" stroke="#2F6FED" stroke-width="2" stroke-dasharray="8 6">
      <rect id="Title zone" x="194.6" y="173.1" width="634.9" height="100.4" rx="6"/>
      <rect id="Wordmark zone" x="342.0" y="286.7" width="340" height="40.9" rx="6"/>
      <path id="Rim text zone" d="M879.9 799.4 A466.8 466.8 0 0 1 144.1 799.4 L161.7 785.7 A444.5 444.5 0 0 0 862.3 785.7 Z"/>
    </g>
    <g id="Labels" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
      <text x="512.0" y="161.1" text-anchor="middle" fill="#2F6FED">TITLE · centred · up to 634 px wide, shrinks to fit</text>
      <text x="512.0" y="349.5" text-anchor="middle" fill="#2F6FED">WORDMARK / YEAR</text>
      <text x="512.0" y="910.5" text-anchor="middle" fill="#2F6FED">RIM TEXT · centred at the bottom, grows both ways</text>
      <text x="512.0" y="658.9" text-anchor="middle" fill="#FF2D6F">HUB · hidden (245 px)</text>
      <g fill="#C2185B" font-size="14">
        <text x="20" y="34">HIDDEN · corners</text>
        <text x="20" y="54" font-weight="500">art shows inside a 997 px circle</text>
        <text x="1004" y="34" text-anchor="end">1024 × 1024 · square</text>
        <text x="1004" y="54" text-anchor="end" font-weight="500">images: JPG / PNG</text>
        <text x="20" y="984">Video / GIF: same frame, loop it</text>
        <text x="20" y="1004" font-weight="500">video is compressed to &lt; 5 MB on deploy</text>
        <text x="1004" y="984" text-anchor="end">Pick black or white disc</text>
        <text x="1004" y="1004" text-anchor="end" font-weight="500">text in the Site Editor</text>
      </g>
    </g>
  </g>
</svg>
